<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Bob Rohrman Hyundai — Shop Dashboard</title>
  <!--
    Short address for the shop TV: rohrmanhyundai.github.io/dashboard
    Shows the real TV dashboard (/Rohrmanhyundai/dashboard/) full-screen, so
    the address bar stays short and the TV never gets a "not found" page.
    Same site, so the dashboard behaves exactly as if opened directly.
  -->
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#0d1627; }
    iframe { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; }
  </style>
</head>
<body>
  <iframe src="/Rohrmanhyundai/dashboard/" title="Shop Dashboard" allow="fullscreen" allowfullscreen></iframe>
</body>
</html>
